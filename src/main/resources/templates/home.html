<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ブログ一覧</title>
</head>
<body>

    <header>
        <nav>
            <a th:href="@{/}">ホーム</a> | 
            <a th:href="@{/post}">新規投稿</a>
        </nav>
    </header>

    <main>
        <h1>記事一覧</h1>
        
        <div th:each="blog : ${blogs}">
            <h2>
                <a th:href="@{'/blog/' + ${blog.id}}" th:text="${blog.title}">タイトル</a>
            </h2>

            <p>著者: <span th:text="${blog.auther}">著者名</span></p>
            <p th:text="${blog.text}">本文</p>
            
        </div>
    </main>

</body>
</html>
