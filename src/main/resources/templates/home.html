<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ブログ一覧</title>
    <link rel="stylesheet" th:href="@{/stylee.css}">
</head>
<body>
    <div th:replace="~{fragment/title :: header}"></div>

    

    <main>
        <h1>記事一覧</h1>
        
        <div th:each="blog : ${blogs}">
            <h2>
                <a th:href="@{'/blog/' + ${blog.id}}" th:text="${blog.title}">タイトル</a>
            </h2>

            <p>著者: <span th:text="${blog.auther}">著者名</span></p>
            <p th:text="${blog.text}">本文</p>
            
        </div>
    </main>

</body>
</html>
